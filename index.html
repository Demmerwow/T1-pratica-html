<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Prática HTML</title>
</head>
<body>

    <!-- Título principal da página -->
    <h1>Bem-vindo à minha primeira página!</h1>

    <!-- Parágrafo de texto -->
    <p>Este é um parágrafo de exemplo. Aqui podemos colocar textos, <strong>negrito</strong>, <em>itálico</em> e até mesmo <a href="https://www.google.com" target="_blank">links externos</a>.</p>

    <!-- Lista não ordenada (com marcadores) -->
    <h2>O que estou aprendendo:</h2>
    <ul>
        <li>Estrutura básica do HTML</li>
        <li>Tags de texto (h1, p, strong)</li>
        <li>Listas</li>
    </ul>

    <!-- Imagem -->
    <h2>Uma imagem de exemplo:</h2>
    <img src="https://via.placeholder.com/300x200?text=Minha+Imagem" alt="Imagem de exemplo com fundo cinza">

</body>
</html>
